[package]
name = "ln-hub"
version = "0.1.0"
edition = "2024"

[lib]
name = "ln_hub"
path = "src/lib.rs"

[[bin]]
name = "ln-hub"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
